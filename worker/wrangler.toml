name = "matchday-ai"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
# Origins allowed to call this worker. Add your own if you move the app.
ALLOWED_ORIGINS = "https://akchops.github.io"
# Coach requests allowed per person per day, before they're asked for their own key.
DAILY_LIMIT = "40"
# Models to try first, best first. Anything else Google lists comes after, and
# the worker remembers whichever last answered. Measured 24 Sep 2026 on this key
# (free tier): 3.6-flash answers in seconds when Google has room for it;
# 3.5-flash-lite nearly always answers but takes 20-45s; 3.8, 3.7, 3.5-flash and
# 3.1-flash-lite returned "high demand" every time; the 2.5 models are gone.
# When things change, run "Check AI proxy" in the Actions tab, put the models
# that pass here, and redeploy. Empty lets the worker choose on its own.
GEMINI_MODEL = "gemini-3.6-flash,gemini-3.5-flash-lite"
GEMINI_FAST_MODEL = "gemini-3.6-flash,gemini-3.5-flash-lite"

# Created by setup.sh - holds the per-IP daily counters and the cached model id.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_ID"
