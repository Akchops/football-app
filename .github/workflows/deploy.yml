name: Deploy to GitHub Pages

on:
  push:
    # The working branch today, and main in case the default branch is renamed later.
    branches: [claude/football-match-tracker-n5cq0n, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          # Set this repository variable to the AI proxy's URL (see worker/README.md).
          # Left empty, the app falls back to asking each player for their own key.
          VITE_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

      # Static host with no server-side routing, so the 404 page serves the app.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
