<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Track your football matches, results and stats on a calendar." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Matchday" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Matchday</title>
    <script>
      // Dark unless this phone chose Light or Automatic in Setup - set before
      // anything draws, so the app never flashes the wrong colours.
      try {
        var theme = localStorage.getItem('matchday.theme.v1');
        document.documentElement.setAttribute('data-theme', theme === 'light' || theme === 'auto' ? theme : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
